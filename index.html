<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS AI Assistant</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { color-scheme: dark; --ink:#edf5f6; --muted:#82999e; --line:rgba(190,225,226,.12); --accent:#70d6c7; }
        body { min-height:100vh; background:#0b1113; color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, sans-serif; overflow-x:hidden; }
        body::before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 16% 8%,rgba(51,126,119,.16),transparent 38%),linear-gradient(135deg,transparent 55%,rgba(255,255,255,.018)); }
        .container { position:relative; width:min(1180px,100%); min-height:100vh; margin:auto; padding:30px 48px 42px; display:grid; grid-template-columns:minmax(300px,.9fr) minmax(380px,1.1fr); grid-template-rows:auto 1fr; gap:32px 72px; }
        .topbar { grid-column:1/-1; display:flex; justify-content:space-between; align-items:center; padding-bottom:20px; border-bottom:1px solid var(--line); }
        .brand { display:flex; gap:12px; align-items:center; font-size:13px; font-weight:650; letter-spacing:.17em; }
        .brand-mark { width:30px;height:30px;border:1px solid rgba(112,214,199,.55);border-radius:9px;display:grid;place-items:center;color:var(--accent);font-size:12px; }
        .system-state { display:flex;align-items:center;gap:9px;color:#b4c5c6;font:10px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025); }
        .system-state::before { content:""; width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(112,214,199,.8); }
        .control-panel { display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0 30px; }

        /* =========================
           JARVIS ARC
        ========================= */

        .jarvis-core {
            width: 270px; height: 270px; margin: 0 auto 46px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            background: radial-gradient(circle,rgba(78,166,157,.17),rgba(17,38,38,.3) 48%,transparent 72%);

            box-shadow:
                0 0 52px rgba(75,184,170,.12), inset 0 0 45px rgba(112,214,199,.06);

            transition: 0.3s;
        }

        .jarvis-core::before {
            content: "";

            position: absolute;

            width: 220px; height: 220px;

            border-radius: 50%;

            border: 1px solid rgba(112,214,199,.5); border-left-color:transparent; border-bottom-color:rgba(112,214,199,.15);

            box-shadow:
                0 0 18px rgba(112,214,199,.25);

            animation: rotate 8s linear infinite;
        }

        .jarvis-core::after {
            content: "";

            position: absolute;

            width: 176px; height: 176px;

            border-radius: 50%;

            border: 1px dashed rgba(112,214,199,.22);

            animation: rotateReverse 10s linear infinite;
        }

        .core-light {
            width: 72px; height: 72px;

            border-radius: 50%;

            background:
                radial-gradient(circle,
                    #ffffff 0%,
                    #c3fff3 20%,
                    #70d6c7 45%,
                    #328f85 70%,
                    transparent 72%);

            box-shadow:
                0 0 20px #70d6c7, 0 0 60px rgba(67,180,166,.45);

            animation: pulse 2s infinite;
        }

        .listening .jarvis-core {
            box-shadow:
                0 0 35px rgba(112,214,199,.48),
                0 0 100px rgba(61,171,157,.28),
                inset 0 0 50px rgba(112,214,199,.15);
        }

        .speaking .jarvis-core {
            animation: speakingGlow 0.7s infinite alternate;
        }

        /* =========================
           TEXT
        ========================= */

        .title { font-size:34px; letter-spacing:.25em; margin-bottom:9px; font-weight:600;

            text-shadow:
                0 0 18px rgba(112,214,199,.22);
        }

        .subtitle {
            color:var(--muted);font-size:10px;letter-spacing:.22em;margin-bottom:24px;
        }

        .status {
            min-height: 34px;display:flex;align-items:center;justify-content:center;padding:0 14px;border:1px solid rgba(112,214,199,.17);border-radius:999px;background:rgba(112,214,199,.055);

            font-size: 16px;

            color:var(--accent);font:11px ui-monospace,monospace;letter-spacing:.08em;

            margin-bottom: 20px;

            transition: 0.3s;
        }

        /* =========================
           RESPONSE
        ========================= */

        .response-box {
            min-height: 90px;

            padding: 20px;

            margin: 0 auto 30px;

            border-radius: 15px;

            background: rgba(255,255,255,.035);

            border: 1px solid var(--line);

            box-shadow:
                0 0 20px rgba(59,133,125,.08);

            color:#cfddde;

            line-height: 1.6;

            font-size: 16px;

            backdrop-filter: blur(10px);
        }
        .conversation { align-self:center; padding:34px 0; max-width:510px;width:100%; }
        .eyebrow { color:var(--muted);font:10px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;margin-bottom:16px; }
        .conversation h2 {font-size:29px;line-height:1.25;font-weight:500;letter-spacing:-.04em;margin-bottom:26px;max-width:390px;}
        .response-box { position:relative; margin:0; min-height:210px; padding:26px 28px; border-radius:4px 14px 14px 14px; line-height:1.85; font-size:15px; }
        .response-box::before {content:"JARVIS / RESPONSE";display:block;margin-bottom:18px;color:var(--muted);font:9px ui-monospace,monospace;letter-spacing:.15em;}
        .conversation-foot {margin-top:18px;display:flex;align-items:center;gap:10px;color:#60777a;font:10px ui-monospace,monospace;letter-spacing:.08em;}
        .conversation-foot::before {content:"";height:1px;width:24px;background:var(--accent);opacity:.55;}

        /* =========================
           BUTTON
        ========================= */

        .mic-button {
            width: 76px;
            height: 76px;

            border-radius: 50%;

            border: 1px solid rgba(112,214,199,.65);

            background:
                radial-gradient(circle,
                    rgba(112,214,199,.24),rgba(17,45,44,.9));

            color: white;

            font-size: 10px; letter-spacing:.12em; font-weight:650;

            cursor: pointer;

            box-shadow:
                0 0 20px rgba(112,214,199,.2);

            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
        }

        .mic-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 30px rgba(112,214,199,.42);
        }

        .mic-button.active {
            background:
                radial-gradient(circle,
                    rgba(255, 60, 60, 0.4),
                    rgba(50, 0, 0, 0.9));

            border-color: #db827c;

            box-shadow:
                0 0 25px rgba(219,130,124,.3);
        }
        .mic-button:focus-visible {outline:2px solid var(--accent);outline-offset:4px;}
        .mic-button:active {transform:scale(.97);}

        .hint {
            margin-top: 15px;

            color:#60777a;

            font-size: 9px;letter-spacing:.13em;
        }
        @media (prefers-reduced-motion: reduce) { *,*::before,*::after {animation-duration:.01ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important;} }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes pulse {
            0%, 100% {
                transform: scale(0.9);
                opacity: 0.75;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateReverse {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        @keyframes speakingGlow {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.06);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 760px) {
            .container {min-height:100dvh;padding:20px 22px 36px;grid-template-columns:1fr;grid-template-rows:auto auto auto;gap:16px;}
            .topbar {grid-column:auto;}
            .control-panel {align-items:center;padding:8px 0 0;}
            .conversation {padding:4px 0 20px;}

            .jarvis-core {
                width: 190px; height:190px;
            }

            .jarvis-core::before {
                width: 158px; height:158px;
            }

            .jarvis-core::after {
                width: 128px; height:128px;
            }

            .title {font-size:28px;letter-spacing:.24em;}
            .conversation h2 {font-size:24px;margin-bottom:18px;}
            .conversation {max-width:none;}
            .response-box {font-size:14px;min-height:140px;padding:20px;}
        }
    </style>
</head>

<body>

<div class="container" id="app">
    <header class="topbar">
        <div class="brand"><span class="brand-mark">J</span> JARVIS <span style="color:#60777a;font-weight:400">/ PERSONAL AI</span></div>
        <div class="system-state">System ready</div>
    </header>
    <section class="control-panel" aria-label="Voice assistant controls">
        <div class="jarvis-core"><div class="core-light"></div></div>
        <div class="title">JARVIS</div>
        <div class="subtitle">AI VOICE ASSISTANT</div>
        <div class="status" id="status" aria-live="polite">Click the microphone to start</div>
        <button id="micButton" class="mic-button" type="button" aria-label="Start listening" onclick="toggleAssistant()">START</button>
        <div class="hint">SPEAK NATURALLY · SILENCE DETECTION ENABLED</div>
    </section>
    <section class="conversation" aria-label="Assistant response">
        <div class="eyebrow">VOICE INTERFACE <span style="color:#70d6c7">/ 01</span></div>
        <h2>Your assistant, ready when you are.</h2>
        <div class="response-box" id="responseBox">Hello. I'm ready.</div>
        <div class="conversation-foot">YOUR CONVERSATION WILL APPEAR HERE</div>
    </section>
</div>
<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const N8N_WEBHOOK =
    "https://nandhish.app.n8n.cloud/webhook/jarvis";


/* =========================================================
   VARIABLES
========================================================= */

let mediaRecorder = null;

let audioChunks = [];

let audioStream = null;

let audioContext = null;

let analyser = null;

let microphoneSource = null;

let silenceTimer = null;

let animationFrame = null;

let isListening = false;

let isSpeaking = false;

let isProcessing = false;


/*
    Silence configuration
*/

const SILENCE_DELAY = 1800;

const VOICE_THRESHOLD = 0.018;


/* =========================================================
   ELEMENTS
========================================================= */

const micButton =
    document.getElementById("micButton");

const statusText =
    document.getElementById("status");

const responseBox =
    document.getElementById("responseBox");

const app =
    document.getElementById("app");


/* =========================================================
   STATUS
========================================================= */

function setStatus(message) {

    statusText.textContent = message;

}


/* =========================================================
   UI STATES
========================================================= */

function setListeningUI() {

    app.classList.add("listening");

    app.classList.remove("speaking");

    micButton.classList.add("active");

    micButton.textContent = "STOP";
    micButton.setAttribute("aria-label", "Stop listening");

    setStatus("Listening...");

}


function setSpeakingUI() {

    app.classList.remove("listening");

    app.classList.add("speaking");

    micButton.classList.remove("active");

    micButton.textContent = "AUDIO";
    micButton.setAttribute("aria-label", "Assistant is speaking");

    setStatus("JARVIS is speaking...");

}


function setIdleUI() {

    app.classList.remove("listening");

    app.classList.remove("speaking");

    micButton.classList.remove("active");

    micButton.textContent = "START";
    micButton.setAttribute("aria-label", "Start listening");

    setStatus("Click the microphone to start");

}


/* =========================================================
   TOGGLE ASSISTANT
========================================================= */

async function toggleAssistant() {

    /*
        If currently listening:
        stop microphone.
    */

    if (isListening) {

        stopRecording();

        return;
    }


    /*
        Don't start while JARVIS is speaking
    */

    if (isSpeaking) {

        return;
    }


    /*
        Don't start while processing
    */

    if (isProcessing) {

        return;
    }


    await startRecording();

}


/* =========================================================
   START RECORDING
========================================================= */

async function startRecording() {

    try {

        isProcessing = false;

        audioChunks = [];


        /*
            Request microphone
        */

        audioStream =
            await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });


        /*
            Create MediaRecorder
        */

        mediaRecorder =
            new MediaRecorder(
                audioStream,
                {
                    mimeType: "audio/webm"
                }
            );


        /*
            Audio chunks
        */

        mediaRecorder.ondataavailable = event => {

            if (event.data.size > 0) {

                audioChunks.push(event.data);

            }

        };


        /*
            Recording finished
        */

        mediaRecorder.onstop = async () => {

            cleanupAudioAnalysis();

            stopMicrophone();

            await sendAudio();

        };


        /*
            Start recorder
        */

        mediaRecorder.start();


        isListening = true;

        setListeningUI();


        /*
            Start voice activity detection
        */

        startAudioAnalysis();


        console.log("Recording started");

    }

    catch (error) {

        console.error(
            "Microphone error:",
            error
        );

        setStatus(
            "Microphone permission required"
        );

        alert(
            "Please allow microphone access and try again."
        );

    }

}


/* =========================================================
   AUDIO ANALYSIS
========================================================= */

function startAudioAnalysis() {

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        analyser =
            audioContext.createAnalyser();


        analyser.fftSize = 2048;

        analyser.smoothingTimeConstant = 0.8;


        microphoneSource =
            audioContext.createMediaStreamSource(
                audioStream
            );


        microphoneSource.connect(
            analyser
        );


        const dataArray =
            new Uint8Array(
                analyser.fftSize
            );


        let hasSpoken = false;

        let silenceStart = null;


        function detectVoice() {

            if (!isListening) {

                return;

            }


            analyser.getByteTimeDomainData(
                dataArray
            );


            /*
                Calculate RMS volume
            */

            let sum = 0;

            for (
                let i = 0;
                i < dataArray.length;
                i++
            ) {

                const value =
                    (dataArray[i] - 128) / 128;

                sum += value * value;

            }


            const rms =
                Math.sqrt(
                    sum / dataArray.length
                );


            /*
                Voice detected
            */

            if (rms > VOICE_THRESHOLD) {

                hasSpoken = true;

                silenceStart = null;

            }

            /*
                Silence
            */

            else {

                if (hasSpoken) {

                    if (silenceStart === null) {

                        silenceStart =
                            Date.now();

                    }


                    const silenceDuration =
                        Date.now() -
                        silenceStart;


                    /*
                        Stop after silence
                    */

                    if (
                        silenceDuration >=
                        SILENCE_DELAY
                    ) {

                        console.log(
                            "Silence detected"
                        );

                        stopRecording();

                        return;

                    }

                }

            }


            animationFrame =
                requestAnimationFrame(
                    detectVoice
                );

        }


        detectVoice();

    }

    catch (error) {

        console.error(
            "Audio analysis error:",
            error
        );

    }

}


/* =========================================================
   STOP RECORDING
========================================================= */

function stopRecording() {

    if (!mediaRecorder) {

        return;

    }


    if (
        mediaRecorder.state ===
        "recording"
    ) {

        isListening = false;

        setStatus(
            "Processing..."
        );

        mediaRecorder.stop();

    }

}


/* =========================================================
   STOP MICROPHONE
========================================================= */

function stopMicrophone() {

    if (!audioStream) {

        return;

    }


    audioStream
        .getTracks()
        .forEach(track => {

            track.stop();

        });


    audioStream = null;

}


/* =========================================================
   CLEAN AUDIO ANALYSIS
========================================================= */

function cleanupAudioAnalysis() {

    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;

    }


    if (silenceTimer) {

        clearTimeout(
            silenceTimer
        );

        silenceTimer = null;

    }


    if (microphoneSource) {

        try {

            microphoneSource.disconnect();

        }

        catch (error) {}

        microphoneSource = null;

    }


    if (audioContext) {

        try {

            audioContext.close();

        }

        catch (error) {}

        audioContext = null;

    }


    analyser = null;

}


/* =========================================================
   SEND AUDIO TO N8N
========================================================= */

async function sendAudio() {

    if (!audioChunks.length) {

        console.log(
            "No audio recorded"
        );

        setIdleUI();

        return;

    }


    /*
        Create WebM audio
    */

    const audioBlob =
        new Blob(
            audioChunks,
            {
                type: "audio/webm"
            }
        );


    console.log(
        "Recorded audio size:",
        audioBlob.size
    );


    if (audioBlob.size < 1000) {

        console.log(
            "Audio too small"
        );

        setStatus(
            "I didn't hear anything"
        );

        setTimeout(() => {

            if (!isSpeaking && !isProcessing) {

                startRecording();

            }

        }, 1000);

        return;

    }


    try {

        isProcessing = true;


        setStatus(
            "JARVIS is thinking..."
        );


        /*
            FormData
        */

        const formData =
            new FormData();


        formData.append(
            "data",
            audioBlob,
            "voice.webm"
        );


        /*
            Send to n8n
        */

        const response =
            await fetch(
                N8N_WEBHOOK,
                {
                    method: "POST",

                    body: formData
                }
            );


        console.log(
            "n8n status:",
            response.status
        );


        if (!response.ok) {

            throw new Error(
                `n8n returned ${response.status}`
            );

        }


        /*
            Read JSON
        */

        const result =
            await response.json();


        console.log(
            "JARVIS response:",
            result
        );


        /*
            Show text
        */

        if (result.text) {

            responseBox.textContent =
                result.text;

        }


        /*
            Audio required
        */

        if (!result.audioBase64) {

            console.error(
                "No audio received from n8n"
            );

            setStatus(
                "No audio received"
            );

            isProcessing = false;

            setTimeout(() => {

                if (!isSpeaking) {

                    startRecording();

                }

            }, 1000);

            return;

        }


        /*
            Play JARVIS audio
        */

        isProcessing = false;

        playJARVISAudio(
            result.audioBase64,
            result.mimeType ||
            "audio/wav"
        );

    }

    catch (error) {

        console.error(
            "Send audio error:",
            error
        );


        isProcessing = false;


        setStatus(
            "Connection error"
        );


        /*
            Try again
        */

        setTimeout(() => {

            if (
                !isSpeaking &&
                !isProcessing
            ) {

                startRecording();

            }

        }, 1500);

    }

}


/* =========================================================
   PLAY JARVIS AUDIO
========================================================= */

function playJARVISAudio(
    base64Audio,
    mimeType = "audio/wav"
) {

    console.log(
        "Playing JARVIS audio:",
        mimeType
    );


    try {

        /*
            Convert Base64 â†’ binary
        */

        const binaryString =
            atob(base64Audio);


        const bytes =
            new Uint8Array(
                binaryString.length
            );


        for (
            let i = 0;
            i < binaryString.length;
            i++
        ) {

            bytes[i] =
                binaryString.charCodeAt(i);

        }


        /*
            Create audio Blob
        */

        const blob =
            new Blob(
                [bytes],
                {
                    type: mimeType
                }
            );


        /*
            Create audio URL
        */

        const audioUrl =
            URL.createObjectURL(
                blob
            );


        /*
            Create audio element
        */

        const audio =
            new Audio(
                audioUrl
            );


        audio.volume = 1.0;


        isSpeaking = true;


        setSpeakingUI();


        /*
            Audio started
        */

        audio.onplay = () => {

            console.log(
                "JARVIS audio started"
            );

        };


        /*
            Audio finished
        */

        audio.onended = () => {

            console.log(
                "JARVIS audio finished"
            );


            isSpeaking = false;


            URL.revokeObjectURL(
                audioUrl
            );


            /*
                Automatically listen again
            */

            setTimeout(() => {

                if (!isProcessing) {

                    startRecording();

                }

            }, 300);

        };


        /*
            Audio error
        */

        audio.onerror = event => {

            console.error(
                "Audio playback error:",
                event
            );


            isSpeaking = false;


            URL.revokeObjectURL(
                audioUrl
            );


            setStatus(
                "Audio playback failed"
            );


            /*
                Continue listening
            */

            setTimeout(() => {

                if (!isProcessing) {

                    startRecording();

                }

            }, 1000);

        };


        /*
            Play audio
        */

        audio
            .play()
            .catch(error => {

                console.error(
                    "Audio play failed:",
                    error
                );


                isSpeaking = false;


                URL.revokeObjectURL(
                    audioUrl
                );


                setTimeout(() => {

                    if (!isProcessing) {

                        startRecording();

                    }

                }, 1000);

            });

    }

    catch (error) {

        console.error(
            "Audio decoding error:",
            error
        );


        isSpeaking = false;


        setStatus(
            "Audio decoding failed"
        );


        setTimeout(() => {

            if (!isProcessing) {

                startRecording();

            }

        }, 1000);

    }

}


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
    "load",
    () => {

        console.log(
            "JARVIS Web Assistant loaded"
        );

        console.log(
            "Webhook:",
            N8N_WEBHOOK
        );

    }
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden &&
            isListening
        ) {

            /*
                Stop microphone when
                tab becomes hidden
            */

            stopRecording();

        }

    }
);

</script>

</body>
</html>
