<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS - AI Voice Assistant</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background:
            radial-gradient(circle at top, #172554, #020617 55%);
        color: white;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        width: 90%;
        max-width: 600px;
        text-align: center;
        padding: 40px 25px;
    }

    .title {
        font-size: 52px;
        font-weight: bold;
        letter-spacing: 6px;
        color: #38bdf8;
        text-shadow:
            0 0 10px #38bdf8,
            0 0 30px #0284c7;
    }

    .subtitle {
        margin-top: 10px;
        color: #94a3b8;
        font-size: 16px;
    }

    .orb {
        width: 190px;
        height: 190px;
        margin: 45px auto 30px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                #38bdf8 0%,
                #0284c7 35%,
                #0f172a 70%
            );

        box-shadow:
            0 0 30px #0ea5e9,
            0 0 80px rgba(14,165,233,0.5);

        transition: 0.3s;
    }

    .orb.active {
        animation: pulse 1.5s infinite;
    }

    .orb.processing {
        animation: processing 0.8s infinite alternate;
    }

    @keyframes pulse {
        0% {
            transform: scale(1);
            box-shadow:
                0 0 30px #0ea5e9,
                0 0 80px rgba(14,165,233,0.5);
        }

        50% {
            transform: scale(1.08);
            box-shadow:
                0 0 50px #38bdf8,
                0 0 120px rgba(14,165,233,0.7);
        }

        100% {
            transform: scale(1);
        }
    }

    @keyframes processing {
        from {
            transform: scale(1);
        }

        to {
            transform: scale(1.08);
        }
    }

    .mic-button {
        width: 90px;
        height: 90px;

        border-radius: 50%;
        border: none;

        background: #0284c7;
        color: white;

        font-size: 38px;

        cursor: pointer;

        box-shadow:
            0 0 20px rgba(14,165,233,0.6);

        transition: 0.3s;
    }

    .mic-button:hover {
        transform: scale(1.08);
    }

    .mic-button.active {
        background: #dc2626;
        box-shadow:
            0 0 25px rgba(239,68,68,0.8);
    }

    .status {
        margin-top: 25px;
        min-height: 25px;

        font-size: 18px;
        color: #e2e8f0;
    }

    .language {
        margin-top: 10px;
        color: #64748b;
        font-size: 14px;
    }

    .volume-container {
        width: 100%;
        max-width: 400px;

        height: 8px;

        background: #1e293b;

        border-radius: 10px;

        margin: 25px auto 0;

        overflow: hidden;
    }

    .volume-bar {
        width: 0%;
        height: 100%;

        background: #38bdf8;

        transition: width 0.05s linear;
    }

    .instructions {
        margin-top: 30px;

        color: #64748b;

        font-size: 13px;

        line-height: 1.6;
    }

    .online {
        color: #22c55e;
    }
</style>
</head>

<body>

<div class="container">

    <div class="title">JARVIS</div>

    <div class="subtitle">
        Personal AI Voice Assistant
    </div>

    <div id="orb" class="orb"></div>

    <button
        id="micButton"
        class="mic-button"
        onclick="toggleJarvis()"
    >
        🎤
    </button>

    <div id="statusText" class="status">
        Click the microphone to start
    </div>

    <div id="languageText" class="language">
        Ready
    </div>

    <div class="volume-container">
        <div
            id="volumeBar"
            class="volume-bar"
        ></div>
    </div>

    <div class="instructions">
        Click once to start JARVIS.<br>
        Speak normally and stop speaking when finished.<br>
        JARVIS automatically detects silence and responds.<br>
        Click again to stop.
    </div>

</div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const N8N_WEBHOOK =
    "https://nandhish.app.n8n.cloud/webhook/jarvis";

/*
   How long silence must continue before sending.
   1800 = 1.8 seconds
*/
const SILENCE_DURATION = 1800;

/*
   Microphone sensitivity.

   Lower = more sensitive
   Higher = less sensitive
*/
const SILENCE_THRESHOLD = 0.015;

/*
   Ignore very short sounds/noise.
*/
const MIN_SPEECH_TIME = 500;


/* =========================================================
   DOM
========================================================= */

const micButton =
    document.getElementById("micButton");

const statusText =
    document.getElementById("statusText");

const languageText =
    document.getElementById("languageText");

const volumeBar =
    document.getElementById("volumeBar");

const orb =
    document.getElementById("orb");


/* =========================================================
   VARIABLES
========================================================= */

let stream = null;

let mediaRecorder = null;

let audioContext = null;

let isRunning = false;

let isProcessing = false;

let volumeTimer = null;

let silenceTimer = null;

let speechSynthesisActive = false;


/* =========================================================
   TOGGLE JARVIS
========================================================= */

async function toggleJarvis() {

    if (isRunning) {

        stopJarvis();

    } else {

        await startJarvis();

    }
}


/* =========================================================
   START JARVIS
========================================================= */

async function startJarvis() {

    try {

        console.log(
            "Starting JARVIS..."
        );

        stream =
            await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

        console.log(
            "Microphone permission granted"
        );


        /* AudioContext */

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();

        }


        console.log(
            "AudioContext:",
            audioContext.state
        );


        isRunning = true;

        isProcessing = false;

        micButton.classList.add("active");

        micButton.textContent = "🛑";

        orb.classList.add("active");

        statusText.textContent =
            "Listening...";

        languageText.textContent =
            "JARVIS online";

        languageText.className =
            "language online";


        startRecorder();


    } catch (error) {

        console.error(
            "Microphone error:",
            error
        );

        statusText.textContent =
            "Microphone error: " +
            error.message;

    }
}


/* =========================================================
   STOP JARVIS
========================================================= */

function stopJarvis() {

    console.log(
        "Stopping JARVIS..."
    );


    isRunning = false;

    isProcessing = false;


    /* Stop recorder */

    if (
        mediaRecorder &&
        mediaRecorder.state === "recording"
    ) {

        mediaRecorder.stop();

    }


    /* Stop timers */

    if (volumeTimer) {

        clearInterval(volumeTimer);

        volumeTimer = null;

    }


    if (silenceTimer) {

        clearTimeout(silenceTimer);

        silenceTimer = null;

    }


    /* Stop speech */

    speechSynthesis.cancel();

    speechSynthesisActive = false;


    /* Stop microphone */

    if (stream) {

        stream
            .getTracks()
            .forEach(track => track.stop());

        stream = null;

    }


    /* Close AudioContext */

    if (audioContext) {

        audioContext.close();

        audioContext = null;

    }


    micButton.classList.remove(
        "active"
    );

    micButton.textContent = "🎤";

    orb.classList.remove(
        "active"
    );

    orb.classList.remove(
        "processing"
    );


    volumeBar.style.width =
        "0%";


    statusText.textContent =
        "JARVIS stopped";

    languageText.textContent =
        "Ready";

    languageText.className =
        "language";

}


/* =========================================================
   START RECORDER
========================================================= */

function startRecorder() {

    if (
        !stream ||
        !isRunning ||
        isProcessing
    ) {

        return;

    }


    if (
        mediaRecorder &&
        mediaRecorder.state ===
        "recording"
    ) {

        return;

    }


    console.log(
        "Starting recorder..."
    );


    const chunks = [];

    let hasSpeech = false;

    let speechStartedAt = 0;

    let silenceStartedAt = null;


    /* =====================================================
       ANALYSER
    ===================================================== */

    let source = null;

    let analyser = null;

    let dataArray = null;


    try {

        source =
            audioContext.createMediaStreamSource(
                stream
            );

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 2048;

        analyser.smoothingTimeConstant =
            0.3;

        source.connect(analyser);

        dataArray =
            new Uint8Array(
                analyser.fftSize
            );

        console.log(
            "Microphone analyser connected"
        );

    } catch (error) {

        console.error(
            "Analyser error:",
            error
        );

    }


    /* =====================================================
       MEDIA RECORDER
    ===================================================== */

    try {

        mediaRecorder =
            new MediaRecorder(
                stream,
                {
                    mimeType:
                        "audio/webm"
                }
            );

    } catch (error) {

        console.error(
            "MediaRecorder error:",
            error
        );

        statusText.textContent =
            "Recording is not supported.";

        return;

    }


    /* =====================================================
       DATA AVAILABLE
    ===================================================== */

    mediaRecorder.ondataavailable =
        event => {

            if (
                event.data &&
                event.data.size > 0
            ) {

                chunks.push(
                    event.data
                );

            }

        };


    /* =====================================================
       RECORDER STOP
    ===================================================== */

    mediaRecorder.onstop =
        async () => {

            console.log(
                "Recorder stopped"
            );


            /* Cleanup */

            if (source) {

                try {

                    source.disconnect();

                } catch (e) {}

            }


            if (volumeTimer) {

                clearInterval(
                    volumeTimer
                );

                volumeTimer = null;

            }


            if (silenceTimer) {

                clearTimeout(
                    silenceTimer
                );

                silenceTimer = null;

            }


            volumeBar.style.width =
                "0%";


            if (!isRunning) {

                return;

            }


            /* Create audio */

            const audioBlob =
                new Blob(
                    chunks,
                    {
                        type:
                            "audio/webm"
                    }
                );


            console.log(
                "Recorded audio size:",
                audioBlob.size
            );


            /* Ignore empty audio */

            if (
                audioBlob.size <
                1000
            ) {

                console.log(
                    "Audio too small"
                );

                isProcessing = false;

                statusText.textContent =
                    "Listening...";

                setTimeout(
                    () => {

                        if (isRunning) {

                            startRecorder();

                        }

                    },
                    300
                );

                return;

            }


            /* Send audio */

            await sendAudio(
                audioBlob
            );

        };


    /* =====================================================
       START RECORDING
    ===================================================== */

    mediaRecorder.start();

    console.log(
        "Recording started"
    );

    statusText.textContent =
        "Listening... Speak now";


    /* =====================================================
       VOLUME + SPEECH DETECTION
    ===================================================== */

    volumeTimer =
        setInterval(
            () => {

                if (
                    !isRunning ||
                    !analyser
                ) {

                    return;

                }


                analyser.getByteTimeDomainData(
                    dataArray
                );


                /* Calculate RMS */

                let sum = 0;


                for (
                    let i = 0;
                    i < dataArray.length;
                    i++
                ) {

                    const value =
                        (
                            dataArray[i] -
                            128
                        ) / 128;

                    sum +=
                        value * value;

                }


                const rms =
                    Math.sqrt(
                        sum /
                        dataArray.length
                    );


                /* Volume UI */

                const percent =
                    Math.min(
                        100,
                        rms * 500
                    );


                volumeBar.style.width =
                    percent + "%";


                /* =================================================
                   SPEECH DETECTED
                ================================================= */

                if (
                    rms >
                    SILENCE_THRESHOLD
                ) {

                    /* New speech */

                    if (!hasSpeech) {

                        hasSpeech = true;

                        speechStartedAt =
                            Date.now();

                        console.log(
                            "Speech detected:",
                            rms
                        );

                        statusText.textContent =
                            "Listening...";

                    }


                    /* User is speaking */

                    silenceStartedAt =
                        null;

                    if (silenceTimer) {

                        clearTimeout(
                            silenceTimer
                        );

                        silenceTimer =
                            null;

                    }

                }


                /* =================================================
                   SILENCE DETECTED
                ================================================= */

                else if (
                    hasSpeech
                ) {

                    const speechTime =
                        Date.now() -
                        speechStartedAt;


                    /*
                       Ignore very short noise
                    */

                    if (
                        speechTime >=
                        MIN_SPEECH_TIME
                    ) {

                        if (
                            !silenceStartedAt
                        ) {

                            silenceStartedAt =
                                Date.now();

                            console.log(
                                "Silence started"
                            );


                            /* Start silence timer */

                            silenceTimer =
                                setTimeout(
                                    () => {

                                        if (
                                            mediaRecorder &&
                                            mediaRecorder.state ===
                                            "recording"
                                        ) {

                                            console.log(
                                                "Silence detected. Sending..."
                                            );

                                            statusText.textContent =
                                                "Sending to JARVIS...";

                                            mediaRecorder.stop();

                                        }

                                    },
                                    SILENCE_DURATION
                                );

                        }

                    }

                }

            },
            50
        );

}


/* =========================================================
   SEND AUDIO TO N8N
========================================================= */

async function sendAudio(
    audioBlob
) {

    if (!isRunning) {

        return;

    }


    isProcessing = true;


    statusText.textContent =
        "JARVIS is thinking...";

    languageText.textContent =
        "Processing";


    orb.classList.remove(
        "active"
    );

    orb.classList.add(
        "processing"
    );


    console.log(
        "Sending audio to:",
        N8N_WEBHOOK
    );


    const formData =
        new FormData();


    formData.append(
        "data",
        audioBlob,
        "voice.webm"
    );


    try {

        const response =
            await fetch(
                N8N_WEBHOOK,
                {
                    method: "POST",
                    body: formData
                }
            );


        console.log(
            "n8n status:",
            response.status
        );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                "n8n error " +
                response.status +
                ": " +
                errorText
            );

        }


        const result =
            await response.json();


        console.log(
            "JARVIS response:",
            result
        );


        /* =====================================================
           TAMIL
        ===================================================== */

        if (
            result.language ===
            "ta-IN"
        ) {

            languageText.textContent =
                "Tamil";

            speakTamil(
                result.text
            );

            return;

        }


        /* =====================================================
           ENGLISH
        ===================================================== */

        if (
            result.language ===
            "en-US"
        ) {

            languageText.textContent =
                "English";

            playEnglish(
                result.audioBase64
            );

            return;

        }


        /* =====================================================
           UNKNOWN LANGUAGE
        ===================================================== */

        console.warn(
            "Unknown response language:",
            result.language
        );


        isProcessing = false;

        orb.classList.remove(
            "processing"
        );

        statusText.textContent =
            "Unknown response language";


        if (isRunning) {

            setTimeout(
                () => {

                    startRecorder();

                },
                500
            );

        }


    } catch (error) {

        console.error(
            "n8n request error:",
            error
        );


        isProcessing = false;


        orb.classList.remove(
            "processing"
        );


        statusText.textContent =
            "Connection error";


        languageText.textContent =
            "Error";


        if (isRunning) {

            setTimeout(
                () => {

                    startRecorder();

                },
                1000
            );

        }

    }

}


/* =========================================================
   ENGLISH AUDIO
========================================================= */

function playEnglish(
    base64Audio
) {

    if (!base64Audio) {

        console.error(
            "No English audio received"
        );

        isProcessing = false;

        orb.classList.remove(
            "processing"
        );

        statusText.textContent =
            "No English audio received";


        if (isRunning) {

            startRecorder();

        }

        return;

    }


    try {

        /* Base64 → binary */

        const binaryString =
            atob(base64Audio);


        const bytes =
            new Uint8Array(
                binaryString.length
            );


        for (
            let i = 0;
            i < binaryString.length;
            i++
        ) {

            bytes[i] =
                binaryString.charCodeAt(
                    i
                );

        }


        /* Binary → WAV */

        const blob =
            new Blob(
                [bytes],
                {
                    type:
                        "audio/wav"
                }
            );


        const audioUrl =
            URL.createObjectURL(
                blob
            );


        const audio =
            new Audio(
                audioUrl
            );


        statusText.textContent =
            "JARVIS speaking...";


        orb.classList.add(
            "processing"
        );


        audio.onended =
            () => {

                console.log(
                    "English speech finished"
                );


                URL.revokeObjectURL(
                    audioUrl
                );


                isProcessing =
                    false;


                orb.classList.remove(
                    "processing"
                );


                if (isRunning) {

                    statusText.textContent =
                        "Listening...";

                    orb.classList.add(
                        "active"
                    );

                    startRecorder();

                }

            };


        audio.onerror =
            error => {

                console.error(
                    "English audio error:",
                    error
                );


                URL.revokeObjectURL(
                    audioUrl
                );


                isProcessing =
                    false;


                orb.classList.remove(
                    "processing"
                );


                if (isRunning) {

                    startRecorder();

                }

            };


        audio.play()
            .catch(
                error => {

                    console.error(
                        "Audio play error:",
                        error
                    );


                    URL.revokeObjectURL(
                        audioUrl
                    );


                    isProcessing =
                        false;


                    orb.classList.remove(
                        "processing"
                    );


                    if (isRunning) {

                        startRecorder();

                    }

                }
            );


    } catch (error) {

        console.error(
            "Base64 conversion error:",
            error
        );


        isProcessing =
            false;


        orb.classList.remove(
            "processing"
        );


        if (isRunning) {

            startRecorder();

        }

    }

}


/* =========================================================
   TAMIL SPEECH
========================================================= */

function speakTamil(
    text
) {

    if (!text) {

        console.error(
            "No Tamil text"
        );

        isProcessing =
            false;


        if (isRunning) {

            startRecorder();

        }

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "ta-IN";


    utterance.rate =
        0.95;


    utterance.pitch =
        1.0;


    utterance.volume =
        1.0;


    /* Get browser voices */

    const voices =
        speechSynthesis.getVoices();


    console.log(
        "Available browser voices:",
        voices
    );


    /* Find Tamil voice */

    let tamilVoice =
        voices.find(
            voice =>
                voice.lang
                    .toLowerCase() ===
                "ta-in"
        );


    /* Fallback */

    if (!tamilVoice) {

        tamilVoice =
            voices.find(
                voice =>
                    voice.lang
                        .toLowerCase()
                        .startsWith("ta")
            );

    }


    if (tamilVoice) {

        utterance.voice =
            tamilVoice;


        console.log(
            "Tamil voice selected:",
            tamilVoice.name,
            tamilVoice.lang
        );

    } else {

        console.warn(
            "Tamil voice not found. Browser will use its default voice."
        );

    }


    statusText.textContent =
        "JARVIS speaking Tamil...";


    orb.classList.add(
        "processing"
    );


    speechSynthesisActive =
        true;


    /* =====================================================
       SPEECH FINISHED
    ===================================================== */

    utterance.onend =
        () => {

            console.log(
                "Tamil speech finished"
            );


            speechSynthesisActive =
                false;


            isProcessing =
                false;


            orb.classList.remove(
                "processing"
            );


            if (isRunning) {

                statusText.textContent =
                    "Listening...";

                orb.classList.add(
                    "active"
                );

                startRecorder();

            }

        };


    /* =====================================================
       SPEECH ERROR
    ===================================================== */

    utterance.onerror =
        event => {

            console.error(
                "Tamil speech error:",
                event
            );


            speechSynthesisActive =
                false;


            isProcessing =
                false;


            orb.classList.remove(
                "processing"
            );


            if (isRunning) {

                startRecorder();

            }

        };


    /* Speak */

    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   LOAD BROWSER VOICES
========================================================= */

speechSynthesis.onvoiceschanged =
    () => {

        const voices =
            speechSynthesis.getVoices();


        console.log(
            "Available browser voices:",
            voices
        );

    };


/* Load immediately too */

window.addEventListener(
    "load",
    () => {

        const voices =
            speechSynthesis.getVoices();


        console.log(
            "Initial browser voices:",
            voices
        );

    }
);

</script>

</body>
</html>
