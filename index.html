<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS AI Assistant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    #10243a 0%,
                    #050b12 45%,
                    #020408 100%
                );

            color: #e8f7ff;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: min(900px, 94%);
            text-align: center;
        }

        .title {
            font-size: 42px;
            letter-spacing: 8px;

            margin-bottom: 8px;

            color: #9eeaff;

            text-shadow:
                0 0 25px #00bfff;
        }

        .status {
            color: #8da9b8;
            margin-bottom: 35px;
        }

        .mic-area {
            display: flex;
            justify-content: center;

            margin-bottom: 25px;
        }

        #micButton {
            width: 150px;
            height: 150px;

            border-radius: 50%;

            border: 2px solid #00c8ff;

            background:
                radial-gradient(
                    circle,
                    #123b54,
                    #06111b
                );

            color: white;

            font-size: 55px;

            cursor: pointer;

            box-shadow:
                0 0 25px #008cff,
                inset 0 0 30px #006b99;

            transition: 0.25s;
        }

        #micButton:hover {
            transform: scale(1.05);
        }

        #micButton.active {
            border-color: #00ffcc;

            box-shadow:
                0 0 35px #00ffcc,
                inset 0 0 35px #008f7a;
        }

        #micButton.stop {
            border-color: #ff5555;

            box-shadow:
                0 0 35px #ff2222,
                inset 0 0 30px #8f0000;
        }

        .timer-container {
            width: min(500px, 90%);

            height: 8px;

            background: #15232d;

            border-radius: 10px;

            margin: 20px auto;

            overflow: hidden;
        }

        #timerBar {
            height: 100%;

            width: 0%;

            background: #00d9ff;

            transition: width 0.1s linear;
        }

        #statusText {
            font-size: 18px;

            min-height: 28px;

            color: #aeeaff;
        }

        .conversation {
            margin-top: 30px;

            max-height: 300px;

            overflow-y: auto;

            text-align: left;

            padding: 10px;
        }

        .message {
            margin: 10px 0;

            padding: 12px 16px;

            border-radius: 12px;

            line-height: 1.5;
        }

        .user {
            background: #102d40;

            border-left:
                3px solid #00bfff;
        }

        .jarvis {
            background: #142c24;

            border-left:
                3px solid #00ffae;
        }

        .label {
            font-size: 12px;

            opacity: 0.6;

            margin-bottom: 4px;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="title">
        JARVIS
    </div>


    <div class="status">
        Personal AI Voice Assistant
    </div>


    <div class="mic-area">

        <button id="micButton">
            🎤
        </button>

    </div>


    <div id="statusText">
        Click the microphone to start
    </div>


    <div class="timer-container">

        <div id="timerBar"></div>

    </div>


    <div id="conversation"
         class="conversation">
    </div>


</div>



<script>


/* =====================================================
   N8N WEBHOOK
===================================================== */

const N8N_WEBHOOK =
    "https://nandhish.app.n8n.cloud/webhook/jarvis";


/* =====================================================
   TEST RECORDING TIME
===================================================== */

const RECORDING_DURATION = 5000;


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let mediaRecorder = null;

let audioContext = null;

let isRunning = false;

let isProcessing = false;

let recordingTimer = null;

let progressTimer = null;


/* =====================================================
   ELEMENTS
===================================================== */

const micButton =
    document.getElementById(
        "micButton"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const timerBar =
    document.getElementById(
        "timerBar"
    );


const conversation =
    document.getElementById(
        "conversation"
    );


/* =====================================================
   BUTTON
===================================================== */

micButton.addEventListener(
    "click",
    async () => {

        if (isRunning) {

            stopEverything();

        } else {

            await startListening();

        }

    }
);


/* =====================================================
   START LISTENING
===================================================== */

async function startListening() {

    if (isProcessing) {

        return;

    }


    try {

        /*
        Get microphone
        */

        if (!stream) {

            stream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        audio: {

                            echoCancellation: true,

                            noiseSuppression: true,

                            autoGainControl: true

                        }

                    });


            console.log(
                "Microphone permission granted"
            );

        }


        /*
        AudioContext
        */

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();

        }


        console.log(
            "AudioContext:",
            audioContext.state
        );


        isRunning = true;


        /*
        Button UI
        */

        micButton.classList.add(
            "active"
        );

        micButton.classList.remove(
            "stop"
        );

        micButton.textContent =
            "🎤";


        /*
        Start recording
        */

        startRecorder();


    } catch (error) {

        console.error(
            "Microphone error:",
            error
        );


        statusText.textContent =
            "Microphone error: " +
            error.message;


        isRunning = false;

    }

}


/* =====================================================
   START RECORDER
===================================================== */

function startRecorder() {

    if (!stream) {

        console.error(
            "No microphone stream"
        );

        return;

    }


    if (!isRunning) {

        return;

    }


    /*
    Prevent duplicate recorder
    */

    if (
        mediaRecorder &&
        mediaRecorder.state ===
        "recording"
    ) {

        return;

    }


    /*
    Audio chunks
    */

    const chunks = [];


    /*
    Create recorder
    */

    try {

        mediaRecorder =
            new MediaRecorder(
                stream,
                {
                    mimeType:
                        "audio/webm"
                }
            );

    } catch (error) {

        console.error(
            "MediaRecorder error:",
            error
        );


        statusText.textContent =
            "Recording is not supported.";

        return;

    }


    /*
    Audio data
    */

    mediaRecorder.ondataavailable =
        event => {

            if (
                event.data &&
                event.data.size > 0
            ) {

                chunks.push(
                    event.data
                );

            }

        };


    /*
    Recording stopped
    */

    mediaRecorder.onstop =
        async () => {

            clearTimeout(
                recordingTimer
            );


            clearInterval(
                progressTimer
            );


            timerBar.style.width =
                "0%";


            if (!isRunning) {

                return;

            }


            /*
            Create audio blob
            */

            const audioBlob =
                new Blob(
                    chunks,
                    {
                        type:
                            "audio/webm"
                    }
                );


            console.log(
                "Recorded audio size:",
                audioBlob.size
            );


            if (
                audioBlob.size === 0
            ) {

                console.error(
                    "Empty audio"
                );


                statusText.textContent =
                    "No audio recorded";


                startRecorder();

                return;

            }


            /*
            Send to n8n
            */

            await sendAudio(
                audioBlob
            );

        };


    /*
    Start
    */

    mediaRecorder.start();


    console.log(
        "Recording started"
    );


    statusText.textContent =
        "Listening... Speak now";


    /*
    Start progress bar
    */

    const startTime =
        Date.now();


    progressTimer =
        setInterval(
            () => {

                if (!isRunning) {

                    clearInterval(
                        progressTimer
                    );

                    return;

                }


                const elapsed =
                    Date.now() -
                    startTime;


                const percent =
                    Math.min(
                        100,
                        (
                            elapsed /
                            RECORDING_DURATION
                        ) * 100
                    );


                timerBar.style.width =
                    percent + "%";


            },
            50
        );


    /*
    Automatically stop
    after 5 seconds
    */

    recordingTimer =
        setTimeout(
            () => {

                if (
                    mediaRecorder &&
                    mediaRecorder.state ===
                    "recording"
                ) {

                    console.log(
                        "5 seconds completed"
                    );


                    statusText.textContent =
                        "Sending to JARVIS...";


                    mediaRecorder.stop();

                }

            },
            RECORDING_DURATION
        );

}


/* =====================================================
   SEND AUDIO TO N8N
===================================================== */

async function sendAudio(
    audioBlob
) {

    if (!isRunning) {

        return;

    }


    isProcessing = true;


    statusText.textContent =
        "JARVIS is thinking...";


    console.log(
        "Sending audio to:",
        N8N_WEBHOOK
    );


    /*
    FormData
    */

    const formData =
        new FormData();


    formData.append(
        "data",
        audioBlob,
        "voice.webm"
    );


    try {

        /*
        Send POST request
        */

        const response =
            await fetch(
                N8N_WEBHOOK,
                {
                    method: "POST",

                    body: formData
                }
            );


        console.log(
            "n8n status:",
            response.status
        );


        /*
        Error
        */

        if (!response.ok) {

            const errorText =
                await response.text();


            throw new Error(
                "n8n error " +
                response.status +
                ": " +
                errorText
            );

        }


        /*
        JSON response
        */

        const result =
            await response.json();


        console.log(
            "JARVIS response:",
            result
        );


        /*
        =================================================
        TAMIL
        =================================================
        */

        if (
            result.language ===
            "ta-IN"
        ) {

            isProcessing = false;


            speakTamil(
                result.text
            );


            return;

        }


        /*
        =================================================
        ENGLISH
        =================================================
        */

        if (
            result.language ===
            "en-US"
        ) {

            playEnglish(
                result.audioBase64
            );


            return;

        }


        /*
        Unknown language
        */

        console.warn(
            "Unknown language:",
            result.language
        );


        isProcessing = false;


        statusText.textContent =
            "Unknown response language";


        if (isRunning) {

            setTimeout(
                () => {

                    startRecorder();

                },
                1000
            );

        }


    } catch (error) {

        console.error(
            "n8n request error:",
            error
        );


        statusText.textContent =
            "Connection error";


        isProcessing = false;


        /*
        Continue listening
        */

        if (isRunning) {

            setTimeout(
                () => {

                    startRecorder();

                },
                1000
            );

        }

    }

}


/* =====================================================
   ENGLISH AUDIO
===================================================== */

function playEnglish(
    base64Audio
) {

    if (!base64Audio) {

        console.error(
            "No English audio received"
        );


        isProcessing = false;


        statusText.textContent =
            "No English audio received";


        if (isRunning) {

            startRecorder();

        }


        return;

    }


    try {

        /*
        Base64 → binary
        */

        const binaryString =
            atob(
                base64Audio
            );


        const bytes =
            new Uint8Array(
                binaryString.length
            );


        for (
            let i = 0;
            i < binaryString.length;
            i++
        ) {

            bytes[i] =
                binaryString.charCodeAt(i);

        }


        /*
        WAV blob
        */

        const blob =
            new Blob(
                [bytes],
                {
                    type:
                        "audio/wav"
                }
            );


        const audioUrl =
            URL.createObjectURL(
                blob
            );


        const audio =
            new Audio(
                audioUrl
            );


        statusText.textContent =
            "JARVIS speaking...";


        /*
        Finished
        */

        audio.onended =
            () => {

                URL.revokeObjectURL(
                    audioUrl
                );


                isProcessing =
                    false;


                if (isRunning) {

                    statusText.textContent =
                        "Listening...";


                    startRecorder();

                }

            };


        /*
        Error
        */

        audio.onerror =
            error => {

                console.error(
                    "English audio error:",
                    error
                );


                URL.revokeObjectURL(
                    audioUrl
                );


                isProcessing =
                    false;


                if (isRunning) {

                    startRecorder();

                }

            };


        /*
        Play
        */

        audio.play()
            .catch(
                error => {

                    console.error(
                        "Audio play error:",
                        error
                    );


                    URL.revokeObjectURL(
                        audioUrl
                    );


                    isProcessing =
                        false;


                    if (isRunning) {

                        startRecorder();

                    }

                }
            );


    } catch (error) {

        console.error(
            "Base64 conversion error:",
            error
        );


        isProcessing =
            false;


        if (isRunning) {

            startRecorder();

        }

    }

}


/* =====================================================
   TAMIL SPEECH
===================================================== */

function speakTamil(
    text
) {

    if (!text) {

        console.error(
            "No Tamil text"
        );


        isProcessing =
            false;


        if (isRunning) {

            startRecorder();

        }


        return;

    }


    /*
    Stop previous speech
    */

    speechSynthesis.cancel();


    /*
    Create speech
    */

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    /*
    Tamil
    */

    utterance.lang =
        "ta-IN";


    utterance.rate =
        0.95;


    utterance.pitch =
        1.0;


    utterance.volume =
        1.0;


    /*
    Find Tamil voice
    */

    const voices =
        speechSynthesis.getVoices();


    const tamilVoice =
        voices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith(
                        "ta"
                    )
        );


    if (tamilVoice) {

        utterance.voice =
            tamilVoice;


        console.log(
            "Tamil voice:",
            tamilVoice.name,
            tamilVoice.lang
        );

    } else {

        console.warn(
            "Tamil voice not found"
        );

    }


    statusText.textContent =
        "JARVIS speaking Tamil...";


    /*
    Finished
    */

    utterance.onend =
        () => {

            console.log(
                "Tamil speech finished"
            );


            isProcessing =
                false;


            if (isRunning) {

                statusText.textContent =
                    "Listening...";


                startRecorder();

            }

        };


    /*
    Error
    */

    utterance.onerror =
        event => {

            console.error(
                "Tamil speech error:",
                event
            );


            isProcessing =
                false;


            if (isRunning) {

                startRecorder();

            }

        };


    /*
    Speak
    */

    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   STOP EVERYTHING
===================================================== */

function stopEverything() {

    console.log(
        "Stopping JARVIS..."
    );


    isRunning =
        false;


    isProcessing =
        false;


    /*
    Clear timers
    */

    clearTimeout(
        recordingTimer
    );


    clearInterval(
        progressTimer
    );


    recordingTimer =
        null;


    progressTimer =
        null;


    /*
    Stop recorder
    */

    if (
        mediaRecorder &&
        mediaRecorder.state ===
        "recording"
    ) {

        mediaRecorder.stop();

    }


    /*
    Stop microphone
    */

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        stream =
            null;

    }


    /*
    Stop speech
    */

    speechSynthesis.cancel();


    /*
    Close AudioContext
    */

    if (audioContext) {

        audioContext
            .close()
            .catch(
                () => {}
            );


        audioContext =
            null;

    }


    /*
    UI
    */

    micButton.classList.remove(
        "active"
    );


    micButton.classList.add(
        "stop"
    );


    micButton.textContent =
        "🛑";


    statusText.textContent =
        "Stopped";


    timerBar.style.width =
        "0%";

}


/* =====================================================
   BROWSER VOICES
===================================================== */

speechSynthesis.onvoiceschanged =
    () => {

        const voices =
            speechSynthesis
                .getVoices();


        console.log(
            "Available browser voices:"
        );


        console.table(
            voices.map(
                voice => ({

                    name:
                        voice.name,

                    language:
                        voice.lang

                })
            )
        );

    };


/* =====================================================
   INITIAL LOAD
===================================================== */

window.addEventListener(
    "load",
    () => {

        speechSynthesis
            .getVoices();

    }
);

</script>

</body>

</html>
