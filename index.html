<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #102030 0%, #05080c 45%, #020305 100%);
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
            padding: 30px;
        }

        /* =========================
           JARVIS ARC
        ========================= */

        .jarvis-core {
            width: 240px;
            height: 240px;

            margin: 0 auto 35px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            background:
                radial-gradient(circle,
                    rgba(0, 220, 255, 0.35) 0%,
                    rgba(0, 150, 255, 0.15) 35%,
                    rgba(0, 0, 0, 0.2) 70%);

            box-shadow:
                0 0 25px rgba(0, 200, 255, 0.4),
                0 0 60px rgba(0, 150, 255, 0.2),
                inset 0 0 40px rgba(0, 200, 255, 0.15);

            transition: 0.3s;
        }

        .jarvis-core::before {
            content: "";

            position: absolute;

            width: 200px;
            height: 200px;

            border-radius: 50%;

            border: 2px solid rgba(0, 220, 255, 0.5);

            box-shadow:
                0 0 15px rgba(0, 220, 255, 0.5);

            animation: rotate 8s linear infinite;
        }

        .jarvis-core::after {
            content: "";

            position: absolute;

            width: 165px;
            height: 165px;

            border-radius: 50%;

            border: 1px dashed rgba(0, 200, 255, 0.35);

            animation: rotateReverse 10s linear infinite;
        }

        .core-light {
            width: 80px;
            height: 80px;

            border-radius: 50%;

            background:
                radial-gradient(circle,
                    #ffffff 0%,
                    #55eaff 20%,
                    #00bfff 45%,
                    #0077ff 70%,
                    transparent 72%);

            box-shadow:
                0 0 20px #00d9ff,
                0 0 50px #008cff,
                0 0 90px rgba(0, 150, 255, 0.5);

            animation: pulse 2s infinite;
        }

        .listening .jarvis-core {
            box-shadow:
                0 0 35px rgba(0, 255, 255, 0.7),
                0 0 100px rgba(0, 180, 255, 0.35),
                inset 0 0 50px rgba(0, 255, 255, 0.2);
        }

        .speaking .jarvis-core {
            animation: speakingGlow 0.7s infinite alternate;
        }

        /* =========================
           TEXT
        ========================= */

        .title {
            font-size: 42px;
            letter-spacing: 8px;
            margin-bottom: 10px;

            text-shadow:
                0 0 15px rgba(0, 200, 255, 0.8);
        }

        .subtitle {
            color: #7edfff;
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .status {
            min-height: 25px;

            font-size: 16px;

            color: #8ceaff;

            margin-bottom: 20px;

            transition: 0.3s;
        }

        /* =========================
           RESPONSE
        ========================= */

        .response-box {
            min-height: 90px;

            padding: 20px;

            margin: 0 auto 30px;

            border-radius: 15px;

            background: rgba(0, 20, 35, 0.55);

            border: 1px solid rgba(0, 200, 255, 0.2);

            box-shadow:
                0 0 20px rgba(0, 150, 255, 0.08);

            color: #d9f8ff;

            line-height: 1.6;

            font-size: 16px;

            backdrop-filter: blur(10px);
        }

        /* =========================
           BUTTON
        ========================= */

        .mic-button {
            width: 85px;
            height: 85px;

            border-radius: 50%;

            border: 2px solid #00d9ff;

            background:
                radial-gradient(circle,
                    rgba(0, 200, 255, 0.3),
                    rgba(0, 30, 50, 0.9));

            color: white;

            font-size: 32px;

            cursor: pointer;

            box-shadow:
                0 0 20px rgba(0, 220, 255, 0.4);

            transition: 0.2s;
        }

        .mic-button:hover {
            transform: scale(1.08);

            box-shadow:
                0 0 30px rgba(0, 220, 255, 0.7);
        }

        .mic-button.active {
            background:
                radial-gradient(circle,
                    rgba(255, 60, 60, 0.4),
                    rgba(50, 0, 0, 0.9));

            border-color: #ff5555;

            box-shadow:
                0 0 30px rgba(255, 60, 60, 0.7);
        }

        .hint {
            margin-top: 15px;

            color: #557080;

            font-size: 12px;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes pulse {
            0%, 100% {
                transform: scale(0.9);
                opacity: 0.75;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateReverse {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        @keyframes speakingGlow {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.06);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {
                padding: 20px;
            }

            .jarvis-core {
                width: 190px;
                height: 190px;
            }

            .jarvis-core::before {
                width: 160px;
                height: 160px;
            }

            .jarvis-core::after {
                width: 130px;
                height: 130px;
            }

            .title {
                font-size: 30px;
                letter-spacing: 5px;
            }

            .response-box {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container" id="app">

    <!-- JARVIS CORE -->

    <div class="jarvis-core">
        <div class="core-light"></div>
    </div>

    <!-- TITLE -->

    <div class="title">
        JARVIS
    </div>

    <div class="subtitle">
        AI VOICE ASSISTANT
    </div>

    <!-- STATUS -->

    <div class="status" id="status">
        Click the microphone to start
    </div>

    <!-- RESPONSE -->

    <div class="response-box" id="responseBox">
        Hello sir. I'm ready.
    </div>

    <!-- MICROPHONE -->

    <button
        id="micButton"
        class="mic-button"
        type="button"
        onclick="toggleAssistant()">

        🎤

    </button>

    <div class="hint">
        Speak naturally • Silence detection enabled
    </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const N8N_WEBHOOK =
    "https://nandhish.app.n8n.cloud/webhook/jarvis";


/* =========================================================
   VARIABLES
========================================================= */

let mediaRecorder = null;

let audioChunks = [];

let audioStream = null;

let audioContext = null;

let analyser = null;

let microphoneSource = null;

let silenceTimer = null;

let animationFrame = null;

let isListening = false;

let isSpeaking = false;

let isProcessing = false;


/*
    Silence configuration
*/

const SILENCE_DELAY = 1800;

const VOICE_THRESHOLD = 0.018;


/* =========================================================
   ELEMENTS
========================================================= */

const micButton =
    document.getElementById("micButton");

const statusText =
    document.getElementById("status");

const responseBox =
    document.getElementById("responseBox");

const app =
    document.getElementById("app");


/* =========================================================
   STATUS
========================================================= */

function setStatus(message) {

    statusText.textContent = message;

}


/* =========================================================
   UI STATES
========================================================= */

function setListeningUI() {

    app.classList.add("listening");

    app.classList.remove("speaking");

    micButton.classList.add("active");

    micButton.textContent = "🛑";

    setStatus("Listening...");

}


function setSpeakingUI() {

    app.classList.remove("listening");

    app.classList.add("speaking");

    micButton.classList.remove("active");

    micButton.textContent = "🔊";

    setStatus("JARVIS is speaking...");

}


function setIdleUI() {

    app.classList.remove("listening");

    app.classList.remove("speaking");

    micButton.classList.remove("active");

    micButton.textContent = "🎤";

    setStatus("Click the microphone to start");

}


/* =========================================================
   TOGGLE ASSISTANT
========================================================= */

async function toggleAssistant() {

    /*
        If currently listening:
        stop microphone.
    */

    if (isListening) {

        stopRecording();

        return;
    }


    /*
        Don't start while JARVIS is speaking
    */

    if (isSpeaking) {

        return;
    }


    /*
        Don't start while processing
    */

    if (isProcessing) {

        return;
    }


    await startRecording();

}


/* =========================================================
   START RECORDING
========================================================= */

async function startRecording() {

    try {

        isProcessing = false;

        audioChunks = [];


        /*
            Request microphone
        */

        audioStream =
            await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });


        /*
            Create MediaRecorder
        */

        mediaRecorder =
            new MediaRecorder(
                audioStream,
                {
                    mimeType: "audio/webm"
                }
            );


        /*
            Audio chunks
        */

        mediaRecorder.ondataavailable = event => {

            if (event.data.size > 0) {

                audioChunks.push(event.data);

            }

        };


        /*
            Recording finished
        */

        mediaRecorder.onstop = async () => {

            cleanupAudioAnalysis();

            stopMicrophone();

            await sendAudio();

        };


        /*
            Start recorder
        */

        mediaRecorder.start();


        isListening = true;

        setListeningUI();


        /*
            Start voice activity detection
        */

        startAudioAnalysis();


        console.log("Recording started");

    }

    catch (error) {

        console.error(
            "Microphone error:",
            error
        );

        setStatus(
            "Microphone permission required"
        );

        alert(
            "Please allow microphone access and try again."
        );

    }

}


/* =========================================================
   AUDIO ANALYSIS
========================================================= */

function startAudioAnalysis() {

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        analyser =
            audioContext.createAnalyser();


        analyser.fftSize = 2048;

        analyser.smoothingTimeConstant = 0.8;


        microphoneSource =
            audioContext.createMediaStreamSource(
                audioStream
            );


        microphoneSource.connect(
            analyser
        );


        const dataArray =
            new Uint8Array(
                analyser.fftSize
            );


        let hasSpoken = false;

        let silenceStart = null;


        function detectVoice() {

            if (!isListening) {

                return;

            }


            analyser.getByteTimeDomainData(
                dataArray
            );


            /*
                Calculate RMS volume
            */

            let sum = 0;

            for (
                let i = 0;
                i < dataArray.length;
                i++
            ) {

                const value =
                    (dataArray[i] - 128) / 128;

                sum += value * value;

            }


            const rms =
                Math.sqrt(
                    sum / dataArray.length
                );


            /*
                Voice detected
            */

            if (rms > VOICE_THRESHOLD) {

                hasSpoken = true;

                silenceStart = null;

            }

            /*
                Silence
            */

            else {

                if (hasSpoken) {

                    if (silenceStart === null) {

                        silenceStart =
                            Date.now();

                    }


                    const silenceDuration =
                        Date.now() -
                        silenceStart;


                    /*
                        Stop after silence
                    */

                    if (
                        silenceDuration >=
                        SILENCE_DELAY
                    ) {

                        console.log(
                            "Silence detected"
                        );

                        stopRecording();

                        return;

                    }

                }

            }


            animationFrame =
                requestAnimationFrame(
                    detectVoice
                );

        }


        detectVoice();

    }

    catch (error) {

        console.error(
            "Audio analysis error:",
            error
        );

    }

}


/* =========================================================
   STOP RECORDING
========================================================= */

function stopRecording() {

    if (!mediaRecorder) {

        return;

    }


    if (
        mediaRecorder.state ===
        "recording"
    ) {

        isListening = false;

        setStatus(
            "Processing..."
        );

        mediaRecorder.stop();

    }

}


/* =========================================================
   STOP MICROPHONE
========================================================= */

function stopMicrophone() {

    if (!audioStream) {

        return;

    }


    audioStream
        .getTracks()
        .forEach(track => {

            track.stop();

        });


    audioStream = null;

}


/* =========================================================
   CLEAN AUDIO ANALYSIS
========================================================= */

function cleanupAudioAnalysis() {

    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;

    }


    if (silenceTimer) {

        clearTimeout(
            silenceTimer
        );

        silenceTimer = null;

    }


    if (microphoneSource) {

        try {

            microphoneSource.disconnect();

        }

        catch (error) {}

        microphoneSource = null;

    }


    if (audioContext) {

        try {

            audioContext.close();

        }

        catch (error) {}

        audioContext = null;

    }


    analyser = null;

}


/* =========================================================
   SEND AUDIO TO N8N
========================================================= */

async function sendAudio() {

    if (!audioChunks.length) {

        console.log(
            "No audio recorded"
        );

        setIdleUI();

        return;

    }


    /*
        Create WebM audio
    */

    const audioBlob =
        new Blob(
            audioChunks,
            {
                type: "audio/webm"
            }
        );


    console.log(
        "Recorded audio size:",
        audioBlob.size
    );


    if (audioBlob.size < 1000) {

        console.log(
            "Audio too small"
        );

        setStatus(
            "I didn't hear anything"
        );

        setTimeout(() => {

            if (!isSpeaking && !isProcessing) {

                startRecording();

            }

        }, 1000);

        return;

    }


    try {

        isProcessing = true;


        setStatus(
            "JARVIS is thinking..."
        );


        /*
            FormData
        */

        const formData =
            new FormData();


        formData.append(
            "data",
            audioBlob,
            "voice.webm"
        );


        /*
            Send to n8n
        */

        const response =
            await fetch(
                N8N_WEBHOOK,
                {
                    method: "POST",

                    body: formData
                }
            );


        console.log(
            "n8n status:",
            response.status
        );


        if (!response.ok) {

            throw new Error(
                `n8n returned ${response.status}`
            );

        }


        /*
            Read JSON
        */

        const result =
            await response.json();


        console.log(
            "JARVIS response:",
            result
        );


        /*
            Show text
        */

        if (result.text) {

            responseBox.textContent =
                result.text;

        }


        /*
            Audio required
        */

        if (!result.audioBase64) {

            console.error(
                "No audio received from n8n"
            );

            setStatus(
                "No audio received"
            );

            isProcessing = false;

            setTimeout(() => {

                if (!isSpeaking) {

                    startRecording();

                }

            }, 1000);

            return;

        }


        /*
            Play JARVIS audio
        */

        isProcessing = false;

        playJARVISAudio(
            result.audioBase64,
            result.mimeType ||
            "audio/wav"
        );

    }

    catch (error) {

        console.error(
            "Send audio error:",
            error
        );


        isProcessing = false;


        setStatus(
            "Connection error"
        );


        /*
            Try again
        */

        setTimeout(() => {

            if (
                !isSpeaking &&
                !isProcessing
            ) {

                startRecording();

            }

        }, 1500);

    }

}


/* =========================================================
   PLAY JARVIS AUDIO
========================================================= */

function playJARVISAudio(
    base64Audio,
    mimeType = "audio/wav"
) {

    console.log(
        "Playing JARVIS audio:",
        mimeType
    );


    try {

        /*
            Convert Base64 → binary
        */

        const binaryString =
            atob(base64Audio);


        const bytes =
            new Uint8Array(
                binaryString.length
            );


        for (
            let i = 0;
            i < binaryString.length;
            i++
        ) {

            bytes[i] =
                binaryString.charCodeAt(i);

        }


        /*
            Create audio Blob
        */

        const blob =
            new Blob(
                [bytes],
                {
                    type: mimeType
                }
            );


        /*
            Create audio URL
        */

        const audioUrl =
            URL.createObjectURL(
                blob
            );


        /*
            Create audio element
        */

        const audio =
            new Audio(
                audioUrl
            );


        audio.volume = 1.0;


        isSpeaking = true;


        setSpeakingUI();


        /*
            Audio started
        */

        audio.onplay = () => {

            console.log(
                "JARVIS audio started"
            );

        };


        /*
            Audio finished
        */

        audio.onended = () => {

            console.log(
                "JARVIS audio finished"
            );


            isSpeaking = false;


            URL.revokeObjectURL(
                audioUrl
            );


            /*
                Automatically listen again
            */

            setTimeout(() => {

                if (!isProcessing) {

                    startRecording();

                }

            }, 300);

        };


        /*
            Audio error
        */

        audio.onerror = event => {

            console.error(
                "Audio playback error:",
                event
            );


            isSpeaking = false;


            URL.revokeObjectURL(
                audioUrl
            );


            setStatus(
                "Audio playback failed"
            );


            /*
                Continue listening
            */

            setTimeout(() => {

                if (!isProcessing) {

                    startRecording();

                }

            }, 1000);

        };


        /*
            Play audio
        */

        audio
            .play()
            .catch(error => {

                console.error(
                    "Audio play failed:",
                    error
                );


                isSpeaking = false;


                URL.revokeObjectURL(
                    audioUrl
                );


                setTimeout(() => {

                    if (!isProcessing) {

                        startRecording();

                    }

                }, 1000);

            });

    }

    catch (error) {

        console.error(
            "Audio decoding error:",
            error
        );


        isSpeaking = false;


        setStatus(
            "Audio decoding failed"
        );


        setTimeout(() => {

            if (!isProcessing) {

                startRecording();

            }

        }, 1000);

    }

}


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
    "load",
    () => {

        console.log(
            "JARVIS Web Assistant loaded"
        );

        console.log(
            "Webhook:",
            N8N_WEBHOOK
        );

    }
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden &&
            isListening
        ) {

            /*
                Stop microphone when
                tab becomes hidden
            */

            stopRecording();

        }

    }
);

</script>

</body>
</html>
